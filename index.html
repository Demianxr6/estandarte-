<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ajuste de Precios</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="card">
    <h2>Ajuste de Precio del Artículo</h2>

    <form id="precioForm">
      <label for="precioInicial">Precio Inicial (S/.):</label>
      <input type="number" id="precioInicial" min="0" step="0.01" placeholder="Ej. 1200.00" required>

      <button type="submit">Calcular Precio Final</button>
    </form>

    <div id="resultado" class="resultado hidden">
      <p><strong>Precio Inicial:</strong> S/. <span id="resInicial"></span></p>
      <p><strong>Ajuste Aplicado:</strong> <span id="resAjuste"></span></p>
      <p><strong>Precio Final:</strong> S/. <span id="resFinal" class="monto-final"></span></p>
    </div>
  </div>

  <script src="uno.js"></script>
</body>
</html>
